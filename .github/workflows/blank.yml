name: Product Control - Compilar APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          unzip -o ProductControl_Fuente_Limpio_GitHub.zip -d fuente

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

            - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar aplicación de administrador
        run: gradle -p fuente/android_admin assembleDebug

      - name: Compilar aplicación de empleados
        run: gradle -p fuente/android_employee assembleDebug

      - name: Guardar APKs generadas
        uses: actions/upload-artifact@v4
        with:
          name: Product-Control-APKs
          path: |
            fuente/android_admin/**/build/outputs/apk/**/*.apk
            fuente/android_employee/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
